<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Chalet · Email previews</title>
<style>
    body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #1f3d32; color: #fffcf8; }
    header { padding: 22px 28px; border-bottom: 3px solid #b08d57; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: 20px; }
    header p { margin: 6px 0 0; font-size: 13px; color: #b7c9c0; }
    .grid { display: flex; flex-wrap: wrap; gap: 26px; padding: 26px 28px 56px; align-items: flex-start; }
    .item { background: #fffcf8; border-radius: 14px; overflow: hidden; width: 640px; max-width: 100%; }
    .cap { padding: 12px 16px; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #5c6b63; background: #e7eeea; }
    .subj { padding: 10px 16px; font-size: 13px; color: #1c2420; border-bottom: 1px solid #e7eeea; }
    iframe { width: 100%; border: 0; display: block; background: #e7eeea; }
</style>
</head>
<body>
<header>
    <h1>The Chalet &middot; email previews</h1>
    <p>Sample data only. Nothing is sent and no family data is read.</p>
</header>
<div class="grid" id="grid"></div>

<script type="module">
import { renderBookingEmail, renderHandoverEmail, renderIssueEmail, renderIssueResolvedEmail } from './js/emailTemplate.js';

// Resolve against wherever this page is served from, so the banner
// loads both locally and on GitHub Pages.
const siteUrl = new URL('.', location.href).href;
// Fixed date so the "Here now" badge always demos.
const today = '2026-08-01';

const trips = [
    { name: 'Susie & Alex', startDate: '2026-07-29', endDate: '2026-08-05' },
    { name: 'Ben + 3', startDate: '2026-10-07', endDate: '2026-10-09' },
    { name: 'Micky', startDate: '2026-10-24', endDate: '2026-10-31' },
    { name: 'Jen & Sal', startDate: '2026-12-20', endDate: '2026-12-27' }
];

const samples = [
    ['New booking', renderBookingEmail({
        action: 'booked', who: 'Ben', title: 'Ben + 3',
        startDate: '2026-10-07', endDate: '2026-10-09',
        arrivalTime: '18:30', departureTime: '10:00',
        trips, siteUrl, today
    })],
    ['Booking updated', renderBookingEmail({
        action: 'updated', who: 'Micky', title: 'Micky',
        startDate: '2026-10-24', endDate: '2026-10-31',
        arrivalTime: '14:00', departureTime: '',
        trips, siteUrl, today
    })],
    ['Handover with a shopping list', renderHandoverEmail({
        who: 'Alex',
        nextGuestNote: 'Boiler pilot goes out if you turn it past 3. Left half a bottle of red in the cupboard, help yourselves.',
        shoppingList: ['Toilet Roll', 'Bin Bags', 'Logs', 'Olive Oil'],
        openChecks: ['Bins emptied'],
        laundryLeft: true,
        trips, siteUrl, today
    })],
    ['Handover, all clear', renderHandoverEmail({
        who: 'Susie',
        nextGuestNote: 'Fresh sheets on all the beds.',
        trips, siteUrl, today
    })],
    ['Board report', renderIssueEmail({
        who: 'Jen',
        title: 'Shower door leaks onto the landing',
        category: 'Maintenance',
        description: 'The seal along the bottom of the downstairs shower door has gone. Water runs out onto the wooden floor every time someone uses it. Needs a new strip — a few euros at the hardware shop in town.',
        siteUrl
    })],
    ['Issue resolved', renderIssueResolvedEmail({
        who: 'Micky',
        title: 'the upstairs bathroom tap',
        category: 'Plumbing',
        note: 'New washer fitted — drips gone.',
        siteUrl
    })]
];

const grid = document.getElementById('grid');

// ?only=2 renders a single sample, handy for side-by-side comparisons.
const only = Number(new URLSearchParams(location.search).get('only'));
const shown = Number.isInteger(only) && samples[only] ? [samples[only]] : samples;

for (const [label, mail] of shown) {
    const item = document.createElement('div');
    item.className = 'item';

    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = label;

    const subj = document.createElement('div');
    subj.className = 'subj';
    subj.innerHTML = '<strong>Subject:</strong> ';
    subj.append(document.createTextNode(mail.subject));

    const frame = document.createElement('iframe');
    frame.title = label;
    frame.srcdoc = mail.html;
    frame.addEventListener('load', () => {
        const h = frame.contentDocument?.body?.scrollHeight;
        frame.style.height = `${(h || 900) + 20}px`;
    });

    item.append(cap, subj, frame);
    grid.append(item);
}
</script>
</body>
</html>
